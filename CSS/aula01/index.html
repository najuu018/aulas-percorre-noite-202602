<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading stylesheet</title>
    <!-- CSS embedded (embutido) -->
    <style>
        p{
            font-size: 200px;
        }
        #gato{
            color: yellowgreen;
        }

        #cachorro{
            color: maroon;
        }

    </style>
</head>
<body>
    
    <!-- CSS inline é aquele que vai dentro da própria tag -->
    <p style="color: blueviolet; font-size: 200px;">Ana Júlia</p>
    <p id="cachorro">malu</p>
    <pid="gato">Luiz alberto</p>
</body>
</html>
